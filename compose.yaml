services:
  app:
    build:
      context: .
      target: dev
    ports:
      # 同じ LAN のスマホ実機で確かめるため、開発サーバーを LAN に公開している（spec.md 2.4）
      # worktree ごとにポートを変えたいときは .env に HOST_PORT を書く
      - "${HOST_PORT:-5173}:5173"
    environment:
      - WATCH_POLLING=${WATCH_POLLING:-0}
    volumes:
      - .:/app
      # node_modules はコンテナ専用にする（ホストの macOS 用バイナリと混ぜない）
      - node_modules:/app/node_modules

  # ---- E2E（docker compose --profile e2e ... で使う。通常の docker compose up では起動しない）----
  # この checkout からビルドした本番用イメージ。ホストには公開せず、e2e コンテナから開く
  # （ホストモードでは scripts/e2e-web.sh が 127.0.0.1:E2E_HOST_PORT に公開する）
  e2e-web:
    profiles: [e2e]
    build:
      context: .
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Playwright を実行するコンテナ。ソースはビルド時にコピーし、結果だけを e2e-results/ に書き出す
  e2e:
    profiles: [e2e]
    build:
      context: .
      target: e2e
    environment:
      - E2E_BASE_URL=http://e2e-web
      - CI=${CI:-}
    volumes:
      - ./e2e-results:/app/e2e-results
    depends_on:
      e2e-web:
        condition: service_healthy

volumes:
  node_modules:
