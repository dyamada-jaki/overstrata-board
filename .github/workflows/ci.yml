name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: テスト・型チェック・Lint・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  image:
    name: 本番用イメージのビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: overstrata-board:ci

  e2e:
    name: E2E（Playwright・Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ローカルの Docker と同じ手順で、この commit から本番用イメージと E2E 用イメージをビルドして実行する
      - run: ./scripts/e2e-docker.sh
      # 成功・失敗にかかわらず、レポートと失敗時の trace・スクリーンショット・動画を残す
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 14
          if-no-files-found: warn
