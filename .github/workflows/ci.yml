name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: テスト・型チェック・Lint・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Chromium E2E（375px・1280px）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/e2e.sh --docker
      - name: レポート・trace・ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: ミューテーションテスト（StrykerJS）
    runs-on: ubuntu-latest
    # #34 で CI の実測が36分（上限45分の80%）になったため60分にする。#47 の短縮後に見直す。
    timeout-minutes: 60
    # 比較元の成功記録（過去の run のジョブと step の結果）を読むため、actions: read を付ける。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 比較元から対象までの差分を取るため、履歴をすべて取得する。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # 全対象を通した最も近い比較元からの変更が Markdown だけなら、以下を省略する（scripts/mutation-scope.mjs）。
      # 判定・対象 SHA・比較範囲・理由は Job Summary と mutation-artifacts/scope.md に残す。判定できなければ実行する。
      - name: 実行範囲の判定（Markdown だけの変更なら省略）
        id: scope
        run: node scripts/mutation-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.scope.outputs.skip != 'true'
        run: npm ci
      # 通常テスト・互換処理・Stryker・結果の検証のどこで失敗してもジョブを失敗にする。
      # スコアでは不合格にせず、Job Summary とレポートで確認する。
      # 並列数は CI だけ上げる（手元の既定値は2。stryker.config.mjs・README を参照）。
      - if: steps.scope.outputs.skip != 'true'
        run: npm run test:mutation
        env:
          MUTATION_CONCURRENCY: 4
      - name: レポート・ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-artifacts/
          # 起動前に失敗した場合も、本来の失敗を上書きしない。
          if-no-files-found: warn
          retention-days: 14

  image:
    name: 本番用イメージのビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: overstrata-board:ci
