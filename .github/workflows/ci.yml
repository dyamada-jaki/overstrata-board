name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: テスト・型チェック・Lint・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Chromium E2E（375px・1280px）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/e2e.sh --docker
      - name: レポート・trace・ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: ミューテーションテスト（StrykerJS）
    runs-on: ubuntu-latest
    # #47: 変更前のmain実測も踏まえ、短縮後の安定性を確認して上限を見直す。
    timeout-minutes: 60
    env:
      STRYKER_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 検証済みの比較元から実行を判定
        id: decision
        run: node scripts/mutation-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.decision.outputs.run == 'true'
      # 通常テスト・互換処理・Stryker・結果検証の失敗はジョブを失敗にする。
      - name: 全対象のミューテーションテスト
        if: steps.decision.outputs.run == 'true'
        run: npm run test:mutation
      # 省略した成功ジョブを全対象の成功記録として再利用しない。
      - name: 全対象の成功記録を保存
        if: success() && steps.decision.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: mutation-artifacts/ci-decision.json
          if-no-files-found: error
          retention-days: 14
      - name: 判定・レポート・ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-artifacts/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: 本番用イメージのビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: overstrata-board:ci
